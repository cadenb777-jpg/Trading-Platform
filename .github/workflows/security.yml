name: Security checks

# Runs on every push and pull request and every Monday (new advisories appear without code changes). A red X here
# means: a secret was committed, a package has a known high-severity vulnerability, or the Python code has a
# high-severity issue. It never blocks the website from deploying (that workflow is separate); fix it promptly.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install detect-secrets==1.5.0
      # .secrets.baseline lists the known fake keys in tests; anything new that looks like a key fails here
      # (compared by fingerprint, not line number, so editing a file never trips it)
      - run: python scripts/check-secrets.py

  dependencies:
    name: No known-vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high --omit=dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r helper/requirements.txt -r helper/requirements-extra.txt -r desktop/requirements.txt

  python-code:
    name: No high-severity issues in the Python code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install bandit==1.9.4
      - run: bandit -r helper desktop -x helper/tests,desktop/tests,helper/.venv -lll
