name: CodeQL

# GitHub's own code scanning (free for public repositories): finds injection, unsafe data flows and similar bugs in the
# website (TypeScript) and the helper and desktop app (Python). Results appear under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 3'  # Wednesdays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # GitHub's code scanning is free for public repositories only: skipped while the repository is private
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # to upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - .claude/skills
              - '**/tests/**'
              - '**/*.test.ts'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
