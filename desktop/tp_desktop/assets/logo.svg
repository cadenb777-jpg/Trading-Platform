<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Trading Terminal: the website's blue diamond with a rising amber chart, on the site's deep navy -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14365e"/>
      <stop offset="0.55" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#071222"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f2a93b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9dcf8"/>
      <stop offset="1" stop-color="#4f9fd6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c66a"/>
      <stop offset="1" stop-color="#f2a93b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="52.5" fill="none" stroke="#2c4f7a" stroke-width="3"/>
  <!-- square dotted grid, like the price chart -->
  <g fill="#3a5f8a" opacity="0.55">
    <circle cx="64" cy="64" r="2.4"/><circle cx="106" cy="64" r="2.4"/><circle cx="150" cy="64" r="2.4"/><circle cx="192" cy="64" r="2.4"/>
    <circle cx="64" cy="106" r="2.4"/><circle cx="192" cy="106" r="2.4"/>
    <circle cx="64" cy="150" r="2.4"/><circle cx="192" cy="150" r="2.4"/>
    <circle cx="64" cy="192" r="2.4"/><circle cx="106" cy="192" r="2.4"/><circle cx="150" cy="192" r="2.4"/><circle cx="192" cy="192" r="2.4"/>
  </g>
  <!-- the diamond mark -->
  <path d="M128 40 L216 128 L128 216 L40 128 Z" fill="none" stroke="url(#diamond)" stroke-width="13" stroke-linejoin="round"/>
  <!-- rising chart through the diamond -->
  <path d="M74 160 L106 134 L130 148 L176 96" fill="none" stroke="url(#line)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="176" cy="96" r="12" fill="#f2a93b"/>
  <circle cx="176" cy="96" r="5" fill="#fff3d9"/>
</svg>
